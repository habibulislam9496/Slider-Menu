<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Slider</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="demo">

  <h1 class="title">
    Slider Menu 
  </h1>

  <nav
    class="category-slider"
    id="categorySlider"
    aria-label="Video categories"
  >

    <button
      class="nav-btn left hidden"
      id="prevBtn"
      aria-label="Previous categories"
      type="button"
    >
      ‹
    </button>

    <div
      class="category-list"
      id="categoryList"
      role="tablist"
      tabindex="0"
      aria-label="Categories"
    >

      <button class="category" role="tab" type="button">
        Trending
      </button>

      <button class="category" role="tab" type="button">
        All
      </button>

      <button class="category" role="tab" type="button">
        Videos
      </button>

      <button
        class="category active"
        role="tab"
        type="button"
        aria-selected="true"
      >
        Music
      </button>

      <button class="category" role="tab" type="button">
        Drama
      </button>

      <button class="category" role="tab" type="button">
        Movie
      </button>

      <button class="category" role="tab" type="button">
        News
      </button>

      <button class="category" role="tab" type="button">
        Tech
      </button>

      <button class="category" role="tab" type="button">
        Politics
      </button>

      <button class="category" role="tab" type="button">
        Sports
      </button>

      <button class="category" role="tab" type="button">
        Gaming
      </button>

      <button class="category" role="tab" type="button">
        Education
      </button>

      <button class="category" role="tab" type="button">
        Live
      </button>

    </div>

    <button
      class="nav-btn right"
      id="nextBtn"
      aria-label="Next categories"
      type="button"
    >
      ›
    </button>

  </nav>

</div>

<script src="script.js"></script>

</body>
</html>
